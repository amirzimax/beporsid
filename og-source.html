<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: #0d1f22;
    position: relative;
    display: flex; align-items: center;
  }
  /* هاله‌های رنگی برند، همان پالت صفحه‌ی اصلی */
  body::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(760px 520px at 78% 12%, rgba(18,128,122,.55), transparent 68%),
      radial-gradient(620px 460px at 12% 96%, rgba(224,161,60,.30), transparent 70%);
  }
  .sheen { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.045) 50%, transparent 60%); }

  .wrap { position: relative; display: flex; align-items: center; gap: 56px; padding: 0 76px; width: 100%; }
  .right { flex: 1; min-width: 0; }

  .brand { display: inline-flex; align-items: center; gap: 14px; margin-bottom: 38px; }
  .mark {
    width: 62px; height: 62px; border-radius: 19px; flex: none;
    background: linear-gradient(145deg, #17a79f, #0f6f6a);
    display: grid; place-items: center;
    box-shadow: 0 14px 32px -10px rgba(23,167,159,.75);
  }
  .mark svg { width: 34px; height: 34px; fill: #fff; }
  .brand b { font-size: 40px; font-weight: 900; color: #fff; letter-spacing: -.02em; }

  h1 {
    font-size: 58px; font-weight: 900; line-height: 1.42; color: #fff;
    letter-spacing: -.035em; margin-bottom: 26px;
  }
  /* خط تأکید زیر متن: با background روی خود span تا در RTL دقیقاً هم‌اندازه‌ی متن بماند */
  h1 .hl {
    color: #6fd8cf; white-space: nowrap;
    background-image: linear-gradient(rgba(224,161,60,.45), rgba(224,161,60,.45));
    background-repeat: no-repeat;
    background-size: 100% 13px;
    background-position: 0 calc(100% - 10px);
    border-radius: 4px;
  }
  p.sub { font-size: 27px; color: rgba(255,255,255,.78); line-height: 1.75; font-weight: 400; }

  .pills { display: flex; gap: 12px; margin-top: 40px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 9px;
    background: rgba(255,255,255,.09); border: 1.5px solid rgba(255,255,255,.17);
    color: #eafaf8; font-size: 21px; font-weight: 600;
    padding: 11px 20px; border-radius: 999px;
  }
  .pill svg { width: 18px; height: 18px; stroke: #6fd8cf; stroke-width: 3.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  .domain {
    position: absolute; bottom: 38px; right: 76px;
    font-size: 24px; font-weight: 700; color: rgba(255,255,255,.55);
    direction: ltr; letter-spacing: .01em;
  }

  /* --- کارت گفتگوی نمونه --- */
  .chat {
    width: 372px; flex: none; background: rgba(255,255,255,.055);
    border: 1.5px solid rgba(255,255,255,.14); border-radius: 26px;
    padding: 24px; backdrop-filter: blur(6px);
    box-shadow: 0 34px 70px -24px rgba(0,0,0,.6);
  }
  .chat-top { display: flex; align-items: center; gap: 11px; padding-bottom: 17px; border-bottom: 1.5px solid rgba(255,255,255,.12); margin-bottom: 20px; }
  .av { width: 40px; height: 40px; border-radius: 13px; background: linear-gradient(145deg, #17a79f, #0f6f6a); display: grid; place-items: center; flex: none; }
  .av svg { width: 22px; height: 22px; fill: #fff; }
  .chat-top .who { font-size: 20px; font-weight: 700; color: #fff; }
  .chat-top .on { margin-right: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 16px; color: #7fe3d9; font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 0 4px rgba(74,222,128,.22); }

  .msg { font-size: 19.5px; line-height: 1.72; padding: 14px 17px; border-radius: 17px; margin-bottom: 13px; max-width: 92%; }
  .msg.u { background: rgba(255,255,255,.1); color: #fff; border-end-end-radius: 6px; margin-inline-start: auto; }
  .msg.b { background: linear-gradient(150deg, #17a79f, #0f7a74); color: #fff; border-end-start-radius: 6px; }
  .msg.b b { font-weight: 800; }

  .prod { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.1); border: 1.5px solid rgba(255,255,255,.13); border-radius: 15px; padding: 11px 13px; }
  .thumb {
    width: 46px; height: 46px; border-radius: 11px; flex: none;
    background: linear-gradient(145deg, rgba(111,216,207,.35), rgba(255,255,255,.1));
    border: 1.5px solid rgba(255,255,255,.18);
    display: grid; place-items: center;
  }
  .thumb svg { width: 22px; height: 22px; stroke: rgba(255,255,255,.75); stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .prod .t { font-size: 17px; color: #fff; font-weight: 600; line-height: 1.5; }
  .prod .pr { font-size: 16px; color: #7fe3d9; font-weight: 700; }
</style>
</head>
<body>
<div class="sheen"></div>
<div class="wrap">
  <div class="right">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.03 2 11c0 2.44 1.15 4.65 3 6.3V22l4.1-2.05c.93.2 1.9.3 2.9.3 5.52 0 10-4.03 10-9S17.52 2 12 2z"/></svg></span>
      <b>بپرسید</b>
    </div>
    <h1>مشتری سوال دارد؟<br><span class="hl">همان لحظه</span> جواب می‌گیرد</h1>
    <p class="sub">چت‌بات هوش مصنوعی فروش و پشتیبانی،<br>وصل به موجودی و قیمت واقعی فروشگاه شما</p>
    <div class="pills">
      <span class="pill"><svg viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg>۲۴ ساعته</span>
      <span class="pill"><svg viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg>نصب با یک خط کد</span>
      <span class="pill"><svg viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg>شروع رایگان</span>
    </div>
  </div>

  <div class="chat">
    <div class="chat-top">
      <span class="av"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.03 2 11c0 2.44 1.15 4.65 3 6.3V22l4.1-2.05c.93.2 1.9.3 2.9.3 5.52 0 10-4.03 10-9S17.52 2 12 2z"/></svg></span>
      <span class="who">دستیار فروشگاه</span>
      <span class="on"><span class="dot"></span>آنلاین</span>
    </div>
    <div class="msg u">قاب ردمی ۱۳ موجوده؟</div>
    <div class="msg b">بله، سه رنگ موجوده. قیمتش <b>۲۵۰ هزار تومان</b> است.</div>
    <div class="prod">
      <span class="thumb"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="9" r="1.8"/><path d="m21 15-4.1-4.1a2 2 0 0 0-2.8 0L5 20"/></svg></span>
      <span><span class="t">قاب محافظ Redmi 13</span><br><span class="pr">۲۵۰,۰۰۰ تومان</span></span>
    </div>
  </div>
</div>
<div class="domain">beporsid.com</div>
</body>
</html>

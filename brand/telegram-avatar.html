<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@900&display=swap" rel="stylesheet">
<!--
  عکس پروفایل کانال تلگرام (۱۰۲۴×۱۰۲۴). تلگرام آن را دایره‌ای و کوچک نشان می‌دهد، پس همه‌چیز
  در دایره‌ی مرکزی (حدود ۷۰٪ عرض) می‌ماند و جزئیات ریز ندارد.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #555; padding: 30px; display: flex; gap: 30px; font-family: 'Vazirmatn', Tahoma, sans-serif; }
  .av {
    width: 1024px; height: 1024px; position: relative; overflow: hidden; display: grid; place-items: center;
    background: linear-gradient(150deg, #1db3a9 0%, #12807a 52%, #0b5e59 100%);
  }
  .av::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 18%, rgba(255,255,255,.28), transparent 50%); }
  .av > * { position: relative; }
  .av svg.bubble { width: 640px; height: 640px; filter: drop-shadow(0 26px 40px rgba(0,0,0,.28)); }
  .spark { position: absolute; top: 250px; left: 262px; width: 120px; height: 120px; fill: #f5b93f; filter: drop-shadow(0 8px 14px rgba(0,0,0,.25)); }
  .name { color: #fff; font-weight: 900; font-size: 250px; letter-spacing: -.03em; line-height: 1; margin-top: -40px; text-shadow: 0 18px 36px rgba(0,0,0,.22); }
  .wrapB { display: flex; flex-direction: column; align-items: center; gap: 30px; }
  .wrapB svg { width: 240px; height: 240px; filter: drop-shadow(0 14px 24px rgba(0,0,0,.25)); }
</style>
</head>
<body>

<!-- گزینه‌ی A: حباب گفتگو با چهره‌ی ربات -->
<div class="av" id="A">
  <svg class="bubble" viewBox="0 0 100 100">
    <path d="M50 12C27 12 9 27.5 9 46.5c0 9.6 4.6 18.3 12 24.5V88l16.3-8.4c4 1 8.3 1.5 12.7 1.5 23 0 41-15.5 41-34.6S73 12 50 12z" fill="#fff"/>
    <!-- چهره‌ی ربات -->
    <rect x="28" y="30" width="44" height="32" rx="12" fill="#12807a"/>
    <circle cx="40" cy="44" r="5.2" fill="#fff"/>
    <circle cx="60" cy="44" r="5.2" fill="#fff"/>
    <path d="M41 53.5q9 5 18 0" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <line x1="50" y1="30" x2="50" y2="23" stroke="#12807a" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="50" cy="21" r="3.6" fill="#f5b93f"/>
  </svg>
</div>

<!-- گزینه‌ی B: نام برند با حباب کوچک -->
<div class="av" id="B">
  <div class="wrapB">
    <svg viewBox="0 0 100 100">
      <path d="M50 12C27 12 9 27.5 9 46.5c0 9.6 4.6 18.3 12 24.5V88l16.3-8.4c4 1 8.3 1.5 12.7 1.5 23 0 41-15.5 41-34.6S73 12 50 12z" fill="#fff"/>
      <circle cx="33" cy="47" r="6" fill="#12807a"/><circle cx="50" cy="47" r="6" fill="#12807a"/><circle cx="67" cy="47" r="6" fill="#f5b93f"/>
    </svg>
    <div class="name">بپرسید</div>
  </div>
</div>

</body>
</html>
